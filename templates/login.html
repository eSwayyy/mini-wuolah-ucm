{% extends "base.html" %}
{% block titulo %}Ingresar - Apuntes UCM{% endblock %}
{% block contenido %}
<div class="container" style="max-width: 460px;">
  <div class="card shadow-sm mt-4">
    <div class="card-body">
      <h1 class="h4 mb-3">Ingresar</h1>
      <form method="POST">
        <div class="form-group">
          <label for="correo">Correo</label>
          <input id="correo" type="email" name="correo" class="form-control" required autofocus>
        </div>
        <div class="form-group">
          <label for="clave">Contraseña</label>
          <input id="clave" type="password" name="clave" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>
      <p class="mt-3 mb-0 text-muted small">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
    </div>
  </div>
</div>
{% endblock %}
