{% extends "base.html" %}
{% block titulo %}Registrarse - Apuntes UCM{% endblock %}
{% block contenido %}
<div class="container" style="max-width: 460px;">
  <div class="card shadow-sm mt-4">
    <div class="card-body">
      <h1 class="h4 mb-3">Crear cuenta</h1>
      <form method="POST">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" name="nombre" class="form-control" maxlength="100" required>
        </div>
        <div class="form-group">
          <label for="correo">Correo</label>
          <input id="correo" type="email" name="correo" class="form-control" maxlength="150" required>
        </div>
        <div class="form-group">
          <label for="carrera">Carrera</label>
          <select id="carrera" name="carrera" class="form-control">
            <option value="">(sin carrera)</option>
            {% for c in carreras %}<option value="{{ c.id_carrera }}">{{ c.nombre }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="clave">Contraseña (mínimo 8 caracteres)</label>
          <input id="clave" type="password" name="clave" class="form-control" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Registrarme</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
