<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Apuntes UCM{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/apuntes.css') }}">
  <script src="{{ url_for('static', filename='js/apuntes.js') }}"></script>
</head>
<body class="hold-transition layout-top-nav">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="/inicio">
          <i class="fas fa-home"></i>
          Inicio
        </a>

      <li class="nav-item">
        <a class="nav-link" href="/apuntes">
          <i class="fas fa-book-open"></i>
          Apuntes
        </a>
    </ul>

    <form class="buscador-navbar" action="/apuntes" method="GET">
        <input
            type="search"
            name="q"
            placeholder="Buscar apuntes..."
            aria-label="Buscar apuntes">
        <button type="submit" aria-label="Buscar">
            <i class="fas fa-search"></i>
        </button>
    </form>

    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a class="nav-link" href="/Perfil">
          <i class="fas fa-user"></i>
        </a>
      </li>        
    </ul>
  </nav>
  <div class="content-wrapper p-3">
    {% block contenido %}
    {% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
